name: static-checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install uv
      - run: uv run --project app ruff check --output-format=github app
      - run: uv run --project app ruff format --check app

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install semgrep
      - run: semgrep scan --config p/python --config rules/ --error --metrics=off app/

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      # Системні пакети браузера; якщо дзеркало apt недоступне - лише браузер
      - run: uv run playwright install --with-deps chromium || uv run playwright install chromium
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=html -rxX
      - name: retake.py - 100 % branch coverage
        if: hashFiles('app/src/student_portal/retake.py') != ''
        run: uv run coverage report --include="*/retake.py" --fail-under=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: app/htmlcov/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: app/test-results/
