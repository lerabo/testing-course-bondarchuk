name: static-checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install uv
      - run: uv run --project app ruff check --output-format=github app
      - run: uv run --project app ruff format --check app
      - run: uv run --project app pytest app

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install semgrep
      - run: semgrep scan --config p/python --config rules/ --error --metrics=off app/
