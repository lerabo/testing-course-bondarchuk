[project]
name = "student-portal"
version = "0.6.0"
description = "Система управління студентами - навчальний застосунок курсу «Тестування та супровід ПЗ»"
readme = "README.md"
authors = [
    { name = "Козелко Віталій" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
student-portal = "student_portal:main"
student-portal-dean = "student_portal.dean:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "mutmut>=3.8",
    "pytest>=9.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.1",
    "testcontainers>=4.15",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
extend-select = ["C90", "S"]   # складність і безпека

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# pytest побудований на assert: у тестах S101 - хибне спрацювання
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["student_portal"]
omit = ["*/student_portal/cli.py", "*/student_portal/dean.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
