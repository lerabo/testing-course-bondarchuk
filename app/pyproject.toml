[project]
name = "student-portal"
version = "0.8.0"
description = "Система управління студентами - навчальний застосунок курсу «Тестування та супровід ПЗ»"
readme = "README.md"
authors = [
    { name = "Козелко Віталій" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
student-portal = "student_portal:main"
student-portal-dean = "student_portal.dean:main"
student-portal-api = "student_portal.api:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170",
    "jsonschema>=4.26.0",
    "mutmut>=3.8",
    "pact-python>=4",
    "pytest>=9.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "pytest-playwright>=0.10",
    "ruff>=0.17.1",
    "schemathesis>=4.32.5",
    "testcontainers>=4.15",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
extend-select = ["C90", "S"]   # складність і безпека

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# pytest побудований на assert: у тестах S101 - хибне спрацювання
"tests/**" = ["S101"]
# Базова лінія: mccabe додає до create_app складність вкладених обробників маршрутів
# FastAPI (кожен обробник окремо простий); код застосунку викладача не змінюємо.
# S311 - хибне спрацювання: random імітує затримку мережі (PORTAL_MAX_DELAY), не криптографію.
"src/student_portal/api.py" = ["C901", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["student_portal"]
omit = ["*/student_portal/cli.py", "*/student_portal/dean.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/student_portal/corrections.py",
    "src/student_portal/scholarship.py",
    "src/student_portal/retake.py",
]
pytest_add_cli_args_test_selection = ["tests/lab05", "tests/lab06/test_mutants.py"]
